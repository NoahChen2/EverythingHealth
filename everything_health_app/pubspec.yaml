name: everything_health_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.6.0

# In your pubspec.yaml for everything_health_app_v2

dependencies:
  flutter:
    sdk: flutter
  
  # Use the latest versions, which are compatible with modern Android
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  camera: ^0.11.1
  path_provider: ^2.1.3
  provider: ^6.1.2
  http: ^1.2.0
  auto_size_text: ^3.0.0
  english_words: ^4.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  # Use the latest generator to match the other packages
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
          style: normal
        - asset: assets/fonts/Inter-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
          style: normal
        - asset: assets/fonts/Inter-Semibold.otf
          weight: 600
          style: normal
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
          style: normal
        - asset: assets/fonts/Inter-BoldItalic.otf
          weight: 700
          style: italic