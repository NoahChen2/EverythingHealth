name: everything_health_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.1.2
  http: ^1.4.0
  auto_size_text: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
          style: normal
        - asset: assets/fonts/Inter-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
          style: normal
        - asset: assets/fonts/Inter-Semibold.otf
          weight: 600
          style: normal
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
          style: normal
        - asset: assets/fonts/Inter-BoldItalic.otf
          weight: 700
          style: italic